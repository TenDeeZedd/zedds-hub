name: Suggestion
description: An idea for a new feature, or for making something better.
labels: ["suggestion", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? Great! Please check the [existing issues](https://github.com/TenDeeZedd/zedds-hub/issues?q=is%3Aissue) first, someone may have suggested it already.
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Which mod is the idea for?
      options:
        - "Zedd's: Cheese Making"
        - "Zedd's: Wooden Bucket"
        - A new mod
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see, and how would it work in the game?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would it make better or more fun?
