name: Bug report
description: Something does not work as it should, or the game crashes.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please check the [existing issues](https://github.com/TenDeeZedd/zedds-hub/issues?q=is%3Aissue) first, it may have been reported already.
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      description: Which mod is it about? Not sure? Pick the one you were playing with.
      options:
        - "Zedd's: Cheese Making"
        - "Zedd's: Wooden Bucket"
        - Not sure
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Shown in the Mods menu, or in the file name of the mod.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft version
      placeholder: "1.21.1"
    validations:
      required: true
  - type: input
    id: neoforge-version
    attributes:
      label: NeoForge version
      placeholder: "21.1.251"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps that lead to the problem, as exactly as you can.
      placeholder: |
        1. Place a Curdling Vat...
        2. Fill it with...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash report or log
      description: For a crash, paste a link to the crash report (`crash-reports` folder) or the log (`logs/latest.log`), uploaded to https://mclo.gs. Screenshots are welcome too.
  - type: textarea
    id: other-mods
    attributes:
      label: Other mods
      description: Are you playing in a modpack or with other mods? Which ones?
